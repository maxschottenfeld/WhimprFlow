# WhimprFlow — Cargo workspace root.
# Members are added as each crate is scaffolded (a workspace may only list dirs that exist).
[workspace]
resolver = "2"
members = [
    "crates/whimpr-ipc",
    "crates/whimpr-core",
    "crates/whimpr-audio",
    "crates/whimpr-asr",
    "crates/whimpr-harness",
    "crates/whimpr-cleanup",
    "crates/whimpr-llm-worker",
    "crates/whimpr-sidecar",
    "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["WhimprFlow"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.95"
thiserror = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Proc-macro dylibs are loaded by rustc at build time, and `strip = true` above
# reaches them too. On macOS 27.0.1 the stripped dylibs fail dlopen with
# "mis-aligned LINKEDIT string pool" (2026-10-06), which breaks every release
# build. The shipped binaries are still stripped; only build-time crates aren't.
[profile.release.build-override]
strip = false
